---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
driver:
  name: docker
lint: |
    yamllint .
    ansible-lint
    flake8
platforms:
  - name: omero-database
    image: eniocarboni/docker-rockylinux-systemd:9
    image_version: latest
    privileged: true
    command: /sbin/init
    cgroupns_mode: host
    tmpfs:
      - /sys/fs/cgroup
    groups:
      - docker-hosts
      - omero-py3
      - ome-demoservers
  - name: omero-server
    image: eniocarboni/docker-rockylinux-systemd:9
    image_version: latest
    privileged: true
    command: /sbin/init
    cgroupns_mode: host
    tmpfs:
      - /sys/fs/cgroup
    groups:
      - docker-hosts
      - omero-py3
      - ome-demoservers
  - name: omero-web
    image: eniocarboni/docker-rockylinux-systemd:9
    image_version: latest
    privileged: true
    command: /sbin/init
    cgroupns_mode: host
    tmpfs:
      - /sys/fs/cgroup
    groups:
      - docker-hosts
      - omero-py3
      - ome-demoservers
provisioner:
  name: ansible
  lint:
    name: ansible-lint
  playbooks:
    converge: ../../playbook.yml
scenario:
  name: rockylinux9
verifier:
  name: testinfra
  directory: ../resources/tests/
